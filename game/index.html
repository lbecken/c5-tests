<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FORECAST IS MEMORY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%224%22%20fill%3D%22%230a0d0f%22%2F%3E%3Cpath%20d%3D%22M2%2016h4l2-6%203%2012%203-16%203%2020%203-13%202%203h8%22%20fill%3D%22none%22%20stroke%3D%22%23e6a552%22%20stroke-width%3D%221.6%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ TITLE / TUNING ═══════════════════════════════════════════════════ -->
<section id="title" class="screen active">
  <div class="title-inner">
    <p class="kicker">Independent Signals Review &middot; Berlin &middot; 2026</p>
    <h1>THE FORECAST<br><span>IS MEMORY</span></h1>
    <p class="tagline">A thirty-minute radio drama. Listen for what is under the voice.</p>

    <div class="tuner">
      <div class="tuner-head">
        <span>SHORTWAVE RECEIVER</span>
        <span class="freq"><b id="freq">4.921</b> MHz</span>
      </div>
      <div class="dial-wrap">
        <input id="dial" type="range" min="4600" max="5200" value="4621" step="1">
        <div class="dial-ticks"></div>
      </div>
      <div class="meter"><div id="meter-fill"></div></div>
      <p class="tuner-hint" id="tuner-hint">Turn the dial. Find the carrier.</p>
    </div>

    <button id="begin" class="primary" disabled>Locked</button>
    <button id="resume" class="ghost hidden">Resume review</button>

    <p class="creds">Headphones recommended &middot; the mystery is solvable by ear alone</p>
  </div>
</section>

<!-- ═══ PLAY ════════════════════════════════════════════════════════════ -->
<section id="play" class="screen">
  <header class="bar">
    <div class="bar-left">
      <span class="sig" id="act-label">ACT ONE</span>
      <span class="scene-title" id="scene-title"></span>
    </div>
    <div class="bar-right">
      <div class="clock" id="clock" title="Minutes to the next transmission">
        <span class="clock-t">T&minus;</span><b id="clock-min">28</b>
      </div>
      <button id="btn-evidence" class="chip">Evidence <b id="ev-count">0</b></button>
      <button id="btn-cast" class="chip">Cast</button>
      <button id="btn-settings" class="chip" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <main class="stage">
    <div id="speaker-strip" class="speaker-strip"></div>
    <div id="transcript" class="transcript" aria-live="polite"></div>
  </main>

  <div id="choices" class="choices"></div>

  <footer class="controls">
    <button id="btn-replay" class="ctl" title="Replay this segment">&#8635;</button>
    <button id="btn-play" class="ctl big" title="Pause / resume">&#10074;&#10074;</button>
    <button id="btn-skip" class="ctl" title="Skip to the choice">&#8677;</button>
    <div class="progress"><div id="progress-fill"></div></div>
    <label class="vol"><span>&#9834;</span>
      <input id="vol" type="range" min="0" max="100" value="85"></label>
  </footer>
</section>

<!-- ═══ OVERLAYS ════════════════════════════════════════════════════════ -->
<div id="overlay" class="overlay">
  <div class="panel" id="panel">
    <button class="close" id="close-overlay">&times;</button>
    <div id="panel-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="story.js"></script>
<script src="engine.js"></script>
</body>
</html>

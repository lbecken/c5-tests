[project]
name = "reader-tts"
version = "1.0.0"
description = "Dictionary-controlled offline English text-to-speech reader"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "torch>=2.4", "misaki[en]>=0.9.4"]

[project.scripts]
reader-tts = "reader_tts.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader_tts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RET",  # return
    "ARG",  # unused arguments
    "TID",  # tidy imports
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["soundfile.*", "kokoro.*", "torch.*", "misaki.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The real-model tests are excluded by default so the ordinary suite needs
# neither the model nor several minutes. Run them with: pytest -m real_tts
addopts = '-q --strict-markers -m "not real_tts"'
markers = [
    "real_tts: tests that require the real Kokoro model and weights (deselect with '-m \"not real_tts\"')",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/reader_tts"]
branch = true
